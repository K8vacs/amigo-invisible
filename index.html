<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amigo Invisible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">

    <div id="stage">
      <canvas id="room" width="160" height="104"></canvas>
    </div>

    <main id="app" class="window">
      <div class="window-title">
        <span>Amigo Invisible</span>
        <span class="x">x</span>
      </div>

      <div class="window-body">

        <section id="screen-intro" class="screen active">
          <h1 id="intro-title"></h1>
          <p id="intro-text"></p>
          <button id="btn-start">Empezar</button>
        </section>

        <section id="screen-question" class="screen">
          <p id="progress"></p>
          <h2 id="question-text"></h2>
          <div id="options"></div>
          <p id="feedback"></p>
        </section>

        <section id="screen-win" class="screen">
          <h1>¡Lo has conseguido!</h1>
          <p>Este es el código para abrir tu regalo:</p>
          <p id="gift-code"></p>
        </section>

        <section id="screen-lose" class="screen">
          <h1>Has perdido…</h1>
          <p id="lose-text"></p>
        </section>

      </div>
    </main>

  </div>

  <script src="js/questions.js"></script>
  <script src="js/room.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
